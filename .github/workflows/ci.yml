name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Pester (${{ matrix.shell }})
    runs-on: windows-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - shell: powershell   # Windows PowerShell 5.1
          - shell: pwsh         # PowerShell 7+

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache Pester module
        uses: actions/cache@v4
        with:
          path: |
            ~\Documents\PowerShell\Modules\Pester
            ~\Documents\WindowsPowerShell\Modules\Pester
          key: pester-5.7.1-${{ runner.os }}

      - name: Run tests (${{ matrix.shell }})
        shell: ${{ matrix.shell }}
        run: |
          tests\Invoke-Tests.ps1 -IncludeIntegration

  lint:
    name: PSScriptAnalyzer
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache PSScriptAnalyzer module
        uses: actions/cache@v4
        with:
          path: ~\Documents\PowerShell\Modules\PSScriptAnalyzer
          key: psscriptanalyzer-${{ runner.os }}

      - name: Install PSScriptAnalyzer
        shell: pwsh
        run: |
          if (-not (Get-Module -ListAvailable PSScriptAnalyzer)) {
            Install-Module PSScriptAnalyzer -Scope CurrentUser -Force
          }

      - name: Analyze
        shell: pwsh
        run: |
          Import-Module PSScriptAnalyzer
          $results = Invoke-ScriptAnalyzer -Path . -Recurse -Settings PSScriptAnalyzerSettings.psd1
          if ($results) {
            $results | Format-Table RuleName,Severity,ScriptName,Line,Message -AutoSize -Wrap
            throw ("PSScriptAnalyzer reported {0} issue(s)." -f $results.Count)
          }
          Write-Host "PSScriptAnalyzer: clean."
